name: Mobile weekly picker smoke
on:
  push:
    branches: ['qa/weekly-cafe-r5-browser']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx release-qa/browser-smoke.mts
      - uses: actions/upload-artifact@v4
        with:
          name: verified-picker
          path: |
            .release-browser/ep0*-picker.png
            .release-browser/receipt.json
          include-hidden-files: true
          retention-days: 14
