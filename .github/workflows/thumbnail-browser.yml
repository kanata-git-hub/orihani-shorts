name: Thumbnail browser checks

on:
  pull_request:
    paths:
      - src/thumbnail/**
      - src/workflow/Kling4Workspace.tsx
      - src/workflow/workflow.css
      - src/compact-mobile.css
      - public/fonts/**
      - tests/thumbnail-browser.cjs
      - tests/thumbnail.test.cjs
      - package.json
      - package-lock.json
      - .github/workflows/thumbnail-browser.yml
  push:
    branches: [main]
    paths:
      - src/thumbnail/**
      - src/workflow/Kling4Workspace.tsx
      - src/workflow/workflow.css
      - src/compact-mobile.css
      - public/fonts/**
      - tests/thumbnail-browser.cjs
      - tests/thumbnail.test.cjs
      - package.json
      - package-lock.json
      - .github/workflows/thumbnail-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser test runner without changing dependency manifests
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install bundled Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: node --test tests/thumbnail.test.cjs
      - run: node tests/thumbnail-browser.cjs
      - name: Save thumbnail previews and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-browser-preview
          path: thumbnail-preview/
          if-no-files-found: warn
