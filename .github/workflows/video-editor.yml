name: Video editor checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig
      - name: Install the actual caption font
        run: |
          mkdir -p ~/.local/share/fonts
          cp src/KyoboHandwriting2024psw.ttf ~/.local/share/fonts/
          fc-cache -f
          test "$(fc-match -f '%{family}' 'Kyobo Handwriting 2024')" = 'Kyobo Handwriting 2024'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop --skipLibCheck server.ts server/editor/routes.ts server/editor/render.ts
      - run: node --test tests/editor.test.cjs
        env:
          FFMPEG_PATH: ffmpeg
      - run: npm run build
